name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: typecheck + unit (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "23.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # offline unit tests only (protocol/store/keys/policy/client/entries);
      # network suites are excluded via their names
      - run: bun test test/protocol.test.ts test/store.test.ts test/keys.test.ts test/policy.test.ts test/client.test.ts test/entry.test.ts test/codex.test.ts

  integration:
    name: integration (DHT)${{ matrix.attempt > 1 && ' (retry)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "23.6"
      - run: bun install --frozen-lockfile
      - name: integration suites
        id: run
        continue-on-error: true
        run: bun test test/sidecar.test.ts test/allowlist.test.ts test/resilience.test.ts test/pi.test.ts
      - name: summary
        if: always()
        run: echo "attempt=${{ steps.run.outcome }}"

  integration-retry:
    name: integration retry (only if first failed)
    needs: integration
    if: needs.integration.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "23.6"
      - run: bun install --frozen-lockfile
      - name: integration suites (retry)
        run: bun test test/sidecar.test.ts test/allowlist.test.ts test/resilience.test.ts test/pi.test.ts

  windows:
    name: windows (experimental)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "23.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test/protocol.test.ts test/store.test.ts test/keys.test.ts test/policy.test.ts test/client.test.ts test/entry.test.ts test/codex.test.ts
      - name: sidecar spawn smoke (offline room)
        shell: bash
        run: |
          # random topic: a fixed one is pre-computable and joinable by anyone
          TOPIC=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")
          node src/sidecar.ts --topic "$TOPIC" --id smoke --name smoke --room smoke &
          sleep 5
          tasklist //FI "IMAGENAME eq node.exe" | grep -c node.exe || true
